<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Pousa</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div class="auth-visual__text">
      <h2>Toda grande viagem começa com uma conta.</h2>
      <p>Crie a sua em menos de um minuto e comece a favoritar os lugares que ainda vai conhecer.</p>
    </div>
  </div>

  <div class="auth-form">
    <div class="auth-card">
      <a href="/" class="nav__logo" style="margin-bottom:32px; display:inline-flex;">Pousa<span>.</span></a>
      <h1>Criar sua conta</h1>
      <p>Leva menos de um minuto.</p>

      <div class="form-error" id="formError"></div>

      <form id="registerForm">
        <div class="field">
          <label for="name">Nome</label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn--primary btn--full">Criar conta</button>
      </form>

      <div class="auth-switch">
        Já tem conta? <a href="/login.html">Entrar</a>
      </div>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
</body>
</html>
