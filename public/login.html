<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Pousa</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div class="auth-visual__text">
      <h2>Sua próxima estadia começa com um login.</h2>
      <p>Guarde favoritos, acompanhe reservas e volte sempre que quiser sonhar com a próxima viagem.</p>
    </div>
  </div>

  <div class="auth-form">
    <div class="auth-card">
      <a href="/" class="nav__logo" style="margin-bottom:32px; display:inline-flex;">Pousa<span>.</span></a>
      <h1>Bem-vindo de volta</h1>
      <p>Entre com seu e-mail e senha para continuar.</p>

      <div class="form-error" id="formError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn--primary btn--full">Entrar</button>
      </form>

      <div class="auth-switch">
        Ainda não tem conta? <a href="/register.html">Criar conta</a>
      </div>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
</body>
</html>
